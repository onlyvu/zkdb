<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect x=%272%27 y=%272%27 width=%279%27 height=%279%27 rx=%272.5%27 fill=%27%233046ff%27/%3E%3Crect x=%2713%27 y=%272%27 width=%279%27 height=%279%27 rx=%272.5%27 fill=%27%233046ff%27/%3E%3Crect x=%272%27 y=%2713%27 width=%279%27 height=%279%27 rx=%272.5%27 fill=%27%233046ff%27/%3E%3Crect x=%2713%27 y=%2713%27 width=%279%27 height=%279%27 rx=%272.5%27 fill=%27%23d9f56b%27/%3E%3C/svg%3E" />
    <title>zkDB</title>
    <script>
      // Theme before the first paint, so a dark page never flashes white. Same key as src/theme.ts.
      (function () {
        var t = null;
        try { t = localStorage.getItem('zkdb.theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
